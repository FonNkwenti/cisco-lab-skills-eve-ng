- command: '| section <pattern>'
  context: exec
  ios-classic: pass
  ios-xe: pass
  ios-xr: fail
  xrv: fail
  xrv9k: fail
  notes: "NOT supported on IOS-XR. The `| section <pattern>` pipe modifier used on\
    \ IOS-XE/IOSv (displays the section header + all lines under it) is rejected on\
    \ IOS-XR with `% Invalid input detected at '^' marker.`. Alternatives on IOS-XR:\
    \ (1) `| include <pattern>` — shows only lines matching the pattern (2) `| utility\
    \ \"sed -n '/<pattern>/,/^[^ ]/p'\"` — emulates section by\n    printing from\
    \ the header to the next non-indented line\n(3) `| utility \"awk '/<pattern>/{flag=1}\
    \ flag; /^[^ ]/{if(NR>1 && flag)\n    flag=0}'\"` — awk-based section emulation\
    \ with header reset\n"
- command: '| begin <pattern>'
  context: exec
  ios-classic: pass
  ios-xe: pass
  ios-xr: fail
  xrv: fail
  xrv9k: fail
  notes: 'NOT supported on IOS-XR. The `| begin <pattern>` pipe modifier (displays
    output starting from the first matching line) is rejected on IOS-XR. Alternative:
    `| utility "sed -n ''/<pattern>/,$ p''"`

