  context: exec
  ios-classic: unknown
  ios-xe: unknown
  ios-xr: pass
  xrv: pass
  xrv9k: pass
  notes: 'IOS-XR-only pipe modifier. Passes the show output through a Unix utility
    (sed, awk, grep, cut, sort, uniq, head, tail, wc). This is the most powerful alternative
    to the missing |section and |begin modifiers. Examples: - `| utility wc -l` —
    count lines - `| utility head -20` — first 20 lines - `| utility "grep -v ''^$''"`
    — exclude blank lines - `| utility "sed -n ''/Lo0/,/^[^ ]/p''"` — emulate | section

    '
